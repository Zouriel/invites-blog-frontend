server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered pages first (web-inviter writes /templates/index.html and so on), then the
    # client-rendered shell for everything else: index.csr.html where the build has one, which the
    # prerendered site does, and index.html for the app that isn't prerendered.
    # SPA fallback — Angular Router handles client-side routes.
    # index.html must NOT be cached: it references content-hashed chunk files
    # that change every deploy. A stale index.html points at chunks that 404,
    # which makes lazy-loaded routes (templates, pricing, guide, …) silently
    # fail to navigate. Always revalidate the HTML shell.
    location / {
        try_files $uri $uri/index.html /index.csr.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Brand files keep the same name when they change (icon.svg, favicon.ico, the share image, the
    # email logos), so they must not be cached as immutable: a year-long immutable favicon kept the old
    # logo in browsers after a redesign. An hour, then revalidate. Listed before the rule below because
    # nginx uses the first regex location that matches.
    location ~* ^/(?:icon\.svg|favicon\.ico|apple-touch-icon\.png|og-image\.png|brand/.+)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Long-cache immutable hashed assets (filenames change when content changes).
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Plain-text reference docs (e.g. /template-guide.md, /llms.txt) — served inline as text rather
    # than nginx's default application/octet-stream, so both a browser and a non-JS-executing AI
    # crawler/fetcher can read the content directly without downloading it first.
    location ~* \.(?:md|txt)$ {
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
}
