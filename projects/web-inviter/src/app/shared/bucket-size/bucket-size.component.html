@if (bucket(); as b) {
  <!-- A status line, not a card: the media grid under it is the content of this tab. It does not
       name the bucket — whatever it sits under already did, as a tab label or as the heading of a
       bucket's own page, and a third copy of the name over the same grid says nothing. -->
  <div class="bar">
    <div class="bar__head">
      <strong class="bar__used">{{ used(b) }}</strong>
      <span class="bar__free">{{ free(b) }} free</span>
    </div>

    <ui-progress-bar
      [value]="b.percentUsed"
      [tone]="tone(b)"
      [label]="'This bucket is ' + b.percentUsed + '% full'"
    />

    <p class="bar__sub">
      {{ b.itemCount }} {{ b.itemCount === 1 ? 'item' : 'items' }}
      @if (b.termEndAt) {
        · renews {{ b.termEndAt | date: 'd MMM y' }}
      }
    </p>
  </div>
}
