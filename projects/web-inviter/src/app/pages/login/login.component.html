<section class="auth">
  <header class="auth__head">
    <app-brand-mark class="auth__mark" [size]="40" />
    <h1 class="auth__title">Welcome back</h1>
    <p class="auth__sub">Sign in to your events.</p>
  </header>

  <ui-card padding="lg" class="auth__card">
    @if (failure()) {
      <ui-alert tone="danger" class="auth__alert">{{ failure() }}</ui-alert>
    }

    <!-- The provider first: one tap for most people, and the email form is right below for everyone
         else. Only providers this server has credentials for are listed, so no button can fail. -->
    @if (providers().length) {
      <div class="auth__stack">
        @for (p of providers(); track p.provider) {
          <app-provider-button [provider]="p.provider" [disabled]="busy()" (pressed)="withProvider(p)" />
        }
      </div>
      <div class="auth__or">or with your email</div>
    }

    <!-- Email and password. NOT a one-time code: a code proves you can read an inbox, which is the
         right test for opening one invitation, and the wrong one for an account that owns events and
         guest lists. A real form, so Enter submits from either field. -->
    <form class="auth__stack" (ngSubmit)="signIn()">
      <ui-form-field label="Email">
        <ui-input
          [(ngModel)]="email"
          [ngModelOptions]="{ standalone: true }"
          type="email"
          autocomplete="email"
          inputmode="email"
          name="email"
          placeholder="you@example.com" />
      </ui-form-field>
      <ui-form-field label="Password">
        <ui-password-input
          [(ngModel)]="password"
          [ngModelOptions]="{ standalone: true }"
          autocomplete="current-password"
          name="password" />
      </ui-form-field>
      <ui-button type="submit" variant="primary" [loading]="busy()" [block]="true">Sign in</ui-button>
    </form>
  </ui-card>

  <div class="auth__foot">
    <span>New here? <a routerLink="/join" [queryParams]="nextParams()">Create an account</a></span>
    <span>Making templates? <a routerLink="/signup">Create a designer account</a></span>
  </div>
</section>
