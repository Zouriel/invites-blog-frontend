@if (failed()) {
  <div class="notice">
    <ui-result
      status="404"
      title="We couldn't open this invitation"
      [subtitle]="message() || 'It may have been withdrawn, or you may not be on the guest list.'"
    >
      <ui-button variant="ghost" (click)="goInbox()">Back to my inbox</ui-button>
    </ui-result>
  </div>
} @else {
  <div class="notice">
    <ui-spinner size="lg" label="Opening your invitation" />
  </div>
}
