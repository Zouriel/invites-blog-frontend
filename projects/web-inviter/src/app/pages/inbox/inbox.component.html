<section class="wrap">
  <div class="ib-container">
    <ui-text variant="h2" class="title">Inbox</ui-text>

    @if (loading()) {
      <div class="centered"><ui-spinner /></div>
    } @else if (!received().length) {
      <ui-empty-state
        heading="Nothing sent to you yet"
      >
        <a empty-actions routerLink="/events/new"><ui-button variant="outline">Start an event</ui-button></a>
      </ui-empty-state>
    } @else {
      <div class="grid">
        @for (i of received(); track i.inviteId) {
          <app-event-tile
            [link]="['/invitation', i.campaignId]"
            [title]="i.eventTitle"
            [sub]="(i.inviterName ? i.inviterName + ' · ' : '') + (i.eventDate | date: 'd MMM y')"
            [poster]="i.previewImageUrl"
            [photoCount]="i.photoCount"
            [flag]="i.isNew ? 'New' : i.isPast ? 'Past' : null"
            [flagDim]="!i.isNew && i.isPast"
          >
            <!-- A save the date asks nothing, so there is no reply to show. -->
            @if (i.kind === 'saveTheDate') {
              <ui-badge tone="primary">Save the date</ui-badge>
            } @else {
              <ui-badge [tone]="rsvpTone(i.rsvpStatus)">{{ rsvpLabel(i.rsvpStatus) }}</ui-badge>
            }
          </app-event-tile>
        }
      </div>
    }
  </div>
</section>
