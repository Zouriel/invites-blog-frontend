<ui-container class="tpls">
  <header class="tpls__head">
    <ui-section-label label="The gallery" />
    <ui-text variant="h1">Every invitation we make</ui-text>
    @if (forEvent()) {
      <p class="tpls__forevent">Pick one and it becomes your event's invitation.</p>
    }
    <p class="tpls__lede">
      Each one is a scroll-driven invitation, not a flat card. Hover to watch one move &mdash; open it
      to see the whole thing and make it yours.
    </p>
  </header>

  <!-- The filters and the grid live in a shared component; My templates shows the same one. -->
  <app-template-gallery />
</ui-container>
