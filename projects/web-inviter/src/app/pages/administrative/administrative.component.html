<section class="wrap">
  <div class="ib-container">
    <header class="head">
      <span class="eyebrow">Admin</span>
      <ui-text variant="h1">Administrative</ui-text>
      <ui-text variant="body" class="lead">
        Looking after the gallery — what is published, and what has been reported.
      </ui-text>
    </header>

    <ui-tabs label="Administrative" [selectedIndex]="tab()" (selectedIndexChange)="onTabChange($event)">
      <ui-tab label="System templates">
        <app-admin-templates />
      </ui-tab>

      <!-- Designer-built templates publish to the gallery without review; reports are the net under that. -->
      <ui-tab label="Reports">
        <app-admin-template-reports />
      </ui-tab>

    </ui-tabs>
  </div>
</section>
