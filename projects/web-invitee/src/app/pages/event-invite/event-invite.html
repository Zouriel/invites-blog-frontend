@switch (state()) {
  @case (ViewState.Loading) {
    <div class="notice">
      <ui-spinner size="lg" label="Opening your invitation" />
      <ui-text variant="body" class="muted">Opening your invitation…</ui-text>
    </div>
  }
  @case (ViewState.NotOnList) {
    <div class="notice">
      <ui-result
        status="warning"
        title="You're not on the guest list"
        subtitle="This invitation is reserved for invited guests. The email you verified isn't on the list — if you have another email, sign out and try that one."
      >
        <ui-button variant="ghost" (click)="saveToInbox()">Go to my inbox</ui-button>
      </ui-result>
    </div>
  }
  @case (ViewState.Cancelled) {
    <div class="notice">
      <ui-result
        status="warning"
        title="This event has been cancelled"
        [subtitle]="message() || 'The host has cancelled this event.'"
      >
        <ui-button variant="ghost" (click)="goHome()">Back to invites.blog</ui-button>
      </ui-result>
    </div>
  }
  @case (ViewState.Error) {
    <div class="notice">
      <ui-result
        status="404"
        title="This invitation isn't available"
        [subtitle]="message() || 'This link is not valid or has expired.'"
      >
        <ui-button variant="ghost" (click)="goHome()">Back to invites.blog</ui-button>
      </ui-result>
    </div>
  }
  @case (ViewState.Ready) {
    <!-- The invite iframe scrolls its own content natively; the template runtime animates the
         reveal/curtain from the iframe's own scroll. -->
    <iframe
      #frame
      class="invite-frame"
      title="Your invitation"
      [src]="iframeSrc()!"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      (load)="onFrameLoad()"
    ></iframe>

    <!-- Fixed overlays (don't affect layout) -->
    <div class="floating">
      <!-- The photo box is behind a button rather than below the invitation: the invitation is a
           full-height scrolling document with its own ending, and a grid after it would put the
           photos somewhere nobody scrolls to. -->
      <ui-button variant="ghost" size="lg" (click)="showPhotos.set(true)">Photos</ui-button>
      <ui-button variant="primary" size="lg" class="rsvp" (click)="goRsvp()">RSVP</ui-button>
    </div>

    <!-- Built only once opened, so an invitation nobody asks photos about never loads a box. -->
    <ui-modal size="lg" [(open)]="showPhotos" title="Photos from the night">
      @if (showPhotos()) {
        <app-photo-box [campaignId]="campaignId()" />
      }
      <div modal-footer>
        <ui-button variant="outline" (click)="showPhotos.set(false)">Close</ui-button>
      </div>
    </ui-modal>
    <!-- A bookmark ribbon, not a star: the action is keeping this invitation, not rating it. -->
    <ui-fab label="Save this invitation to your inbox" (click)="saveToInbox()">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round" />
      </svg>
    </ui-fab>
  }
}
